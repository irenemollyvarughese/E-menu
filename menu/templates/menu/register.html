{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Hotel Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #111;
            color: #fff;
        }
        .register-container {
            max-width: 1000px;
            margin: 60px auto;
            background: #181818;
            border-radius: 18px;
            box-shadow: 0 4px 24px #000a;
            padding: 32px;
        }
        .form-control, .form-floating>.form-control {
            background: #222;
            color: #fff;
            border: none;
        }
        .form-control:focus, .form-floating>.form-control:focus {
            background: #222;
            color: #fff;
            border: 1.5px solid #ffd700;
            box-shadow: none;
        }
        .btn-primary {
            background: #ffd700;
            color: #181818;
            border: none;
            font-weight: 600;
            border-radius: 10px;
        }
        .btn-primary:hover {
            background: #fff200;
            color: #181818;
        }
        .login-link {
            display: block;
            margin-top: 20px;
            color: #ffd700;
            text-decoration: none;
            text-align: center;
        }
        .login-link:hover {
            color: #fff200;
            text-decoration: underline;
        }
        label { color: #ffd700; }
        .card-field {
            background: #222;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
<div class="register-container">
    <h2 class="mb-4 text-center">Hotel Registration</h2>
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger py-1">{{ message }}</div>
        {% endfor %}
    {% endif %}
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row g-3">
            <!-- Hotel Name -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card-field form-floating">
                    <input type="text" name="name" class="form-control" id="floatingName" placeholder="Hotel Name" required>
                    <label for="floatingName">Hotel Name</label>
                </div>
            </div>
            <!-- Username -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card-field form-floating">
                    <input type="text" name="username" class="form-control" id="floatingUsername" placeholder="Username" required>
                    <label for="floatingUsername">Username</label>
                </div>
            </div>
            <!-- Password -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card-field form-floating">
                    <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                    <label for="floatingPassword">Password</label>
                </div>
            </div>
            <!-- Location -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card-field form-floating">
                    <textarea name="location" class="form-control" id="floatingLocation" placeholder="Location" rows="2" required></textarea>
                    <label for="floatingLocation">Location</label>
                </div>
            </div>
            <!-- QR Code -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card-field form-floating">
                    <input type="text" name="qr_code" class="form-control" id="floatingQRCode" placeholder="QR Code" required>
                    <label for="floatingQRCode">QR Code</label>
                </div>
            </div>
            <!-- Phone -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card-field form-floating">
                    <input type="tel" name="phone" class="form-control" id="floatingPhone" placeholder="Phone">
                    <label for="floatingPhone">Phone</label>
                </div>
            </div>
            <!-- Start Time -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card-field form-floating">
                    <input type="time" name="start_time" class="form-control" id="floatingStartTime" placeholder="Start Time">
                    <label for="floatingStartTime">Start Time</label>
                </div>
            </div>
            <!-- End Time -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card-field form-floating">
                    <input type="time" name="end_time" class="form-control" id="floatingEndTime" placeholder="End Time">
                    <label for="floatingEndTime">End Time</label>
                </div>
            </div>
            <!-- WiFi Name -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card-field form-floating">
                    <input type="text" name="wifi_name" class="form-control" id="floatingWifiName" placeholder="WiFi Name">
                    <label for="floatingWifiName">WiFi Name</label>
                </div>
            </div>
            <!-- WiFi Password -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card-field form-floating">
                    <input type="text" name="wifi_password" class="form-control" id="floatingWifiPassword" placeholder="WiFi Password">
                    <label for="floatingWifiPassword">WiFi Password</label>
                </div>
            </div>
            <!-- Instagram -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card-field form-floating">
                    <input type="text" name="instagram" class="form-control" id="floatingInstagram" placeholder="Instagram">
                    <label for="floatingInstagram">Instagram</label>
                </div>
            </div>
            <!-- Facebook -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card-field form-floating">
                    <input type="text" name="facebook" class="form-control" id="floatingFacebook" placeholder="Facebook">
                    <label for="floatingFacebook">Facebook</label>
                </div>
            </div>
            <!-- Hotel Image -->
            <div class="col-12 col-md-6 col-lg-4">
                <label for="hotelImage" class="form-label">Hotel Image</label>
                <input type="file" name="hotel_image" class="form-control" id="hotelImage">
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-4">Register</button>
    </form>
    <a href="{% url 'admin_login' %}" class="login-link">Already have an account? Login here</a>
</div>
</body>
</html>
